<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" role="img" aria-label="base folder containing buckets and nested folders">
  <rect width="820" height="230" fill="#0d1117"/>
  <text x="24" y="36" fill="#8b949e" font-family="ui-monospace, Menlo, monospace" font-size="13">base (Drive folder "bucket-base" / Gmail root label / memory)</text>

  <rect x="24" y="56" width="250" height="150" rx="10" fill="#161b22" stroke="#2a3140"/>
  <text x="40" y="82" fill="#7ee787" font-family="ui-monospace, Menlo, monospace" font-size="13">_root/</text>
  <text x="40" y="104" fill="#8b949e" font-family="ui-monospace, Menlo, monospace" font-size="12">objects directly in the base</text>
  <text x="40" y="128" fill="#e6edf3" font-family="ui-monospace, Menlo, monospace" font-size="12">welcome.txt</text>

  <rect x="296" y="56" width="250" height="150" rx="10" fill="#161b22" stroke="#2a3140"/>
  <text x="312" y="82" fill="#79c0ff" font-family="ui-monospace, Menlo, monospace" font-size="13">photos/</text>
  <text x="312" y="104" fill="#8b949e" font-family="ui-monospace, Menlo, monospace" font-size="12">a bucket = a folder in the base</text>
  <text x="324" y="132" fill="#e6edf3" font-family="ui-monospace, Menlo, monospace" font-size="12">2026/</text>
  <text x="340" y="154" fill="#e6edf3" font-family="ui-monospace, Menlo, monospace" font-size="12">trips/</text>
  <text x="356" y="176" fill="#e6edf3" font-family="ui-monospace, Menlo, monospace" font-size="12">cat.png</text>

  <rect x="568" y="56" width="228" height="150" rx="10" fill="#161b22" stroke="#2a3140"/>
  <text x="584" y="82" fill="#79c0ff" font-family="ui-monospace, Menlo, monospace" font-size="13">docs/</text>
  <text x="584" y="104" fill="#8b949e" font-family="ui-monospace, Menlo, monospace" font-size="12">another bucket</text>
  <text x="584" y="132" fill="#e6edf3" font-family="ui-monospace, Menlo, monospace" font-size="12">contract.pdf</text>

  <text x="24" y="226" fill="#8b949e" font-family="ui-monospace, Menlo, monospace" font-size="11">slashes in a key become real nested folders — same layout in Drive, Gmail and memory</text>
</svg>
