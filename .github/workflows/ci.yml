name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (API, React, e2e, examples)
        run: npm run typecheck

      - name: Doctor exit codes and next-step dedupe
        run: npm run test:doctor

      - name: Export layout and manifest
        run: npm run test:export

      - name: Session sign-in, cookie access and 401
        run: npm run test:session

      - name: DriveStore mock suite
        run: npm run test:drive

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
